<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A phone showing a screen-time progress ring approaching its daily limit">
  <rect x="0" y="0" width="600" height="460" rx="28" fill="#DFF4EC"/>

  <!-- phone -->
  <g transform="translate(230,110)">
    <rect x="0" y="0" width="140" height="240" rx="26" fill="#FFFFFF" stroke="#14201A" stroke-width="3"/>
    <rect x="16" y="26" width="108" height="188" rx="10" fill="#F6F3EC"/>

    <!-- progress ring on screen -->
    <g transform="translate(70,110)">
      <circle r="46" fill="none" stroke="#DFF4EC" stroke-width="12"/>
      <circle r="46" fill="none" stroke="#12B886" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="216 289" transform="rotate(-90)"/>
      <text x="0" y="-2" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#14201A" text-anchor="middle">1h 24m</text>
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#5B6963" text-anchor="middle">of 2h limit</text>
    </g>

    <circle cx="70" cy="228" r="6" fill="none" stroke="#14201A" stroke-width="2"/>
  </g>

  <!-- hourglass accent -->
  <g transform="translate(470,90)">
    <path d="M-24 -30 h48 v14 l-20 16 l20 16 v14 h-48 v-14 l20 -16 l-20 -16 Z"
          fill="#FFFFFF" stroke="#F5A623" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-14 -24 h28 l-14 12 Z" fill="#F5A623"/>
    <path d="M-10 22 h20 l-10 -12 Z" fill="#F5A623" opacity="0.5"/>
  </g>

  <!-- warning accent for "approaching limit" -->
  <g transform="translate(110,350)">
    <circle r="26" fill="#FFE9D9"/>
    <path d="M0 -12 L11 9 L-11 9 Z" fill="none" stroke="#F5A623" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="1.5" fill="#F5A623"/>
  </g>
</svg>
