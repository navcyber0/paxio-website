<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="260" fill="#F6F3EC"/>

  <text x="400" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#14201A">The pause that matters</text>

  <!-- incoming post -->
  <rect x="60" y="90" width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E7E2D4" stroke-width="2"/>
  <rect x="82" y="112" width="136" height="10" rx="5" fill="#E7E2D4"/>
  <rect x="82" y="132" width="100" height="10" rx="5" fill="#E7E2D4"/>
  <rect x="82" y="152" width="120" height="10" rx="5" fill="#E7E2D4"/>
  <text x="150" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5B6963">a post appears</text>

  <!-- pause / check icon -->
  <circle cx="400" cy="140" r="44" fill="#FFE9D9" stroke="#F5A623" stroke-width="3"/>
  <text x="400" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F5A623">?</text>
  <text x="400" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5B6963">check first</text>
  <text x="400" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5B6963">the moment that actually matters</text>

  <!-- share decision -->
  <rect x="560" y="90" width="180" height="100" rx="16" fill="#FFFFFF" stroke="#12B886" stroke-width="2"/>
  <circle cx="650" cy="140" r="22" fill="#12B886"/>
  <path d="M638 140 l8 8 l16 -18" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5B6963">then decide to share</text>

  <path d="M245 140 L555 140" stroke="#5B6963" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5B6963"/>
    </marker>
  </defs>
</svg>
