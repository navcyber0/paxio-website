<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="300" fill="#F6F3EC"/>

  <!-- Left: chat -->
  <rect x="80" y="50" width="280" height="200" rx="20" fill="#FFFFFF" stroke="#4C7CF0" stroke-width="3"/>
  <text x="220" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#14201A">In-game chat</text>
  <!-- speech bubbles -->
  <rect x="110" y="115" width="130" height="30" rx="15" fill="#E7ECFC"/>
  <rect x="160" y="155" width="130" height="30" rx="15" fill="#4C7CF0"/>
  <rect x="110" y="195" width="100" height="30" rx="15" fill="#E7ECFC"/>
  <text x="220" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5B6963">open by default in many games</text>

  <!-- Right: spending -->
  <rect x="440" y="50" width="280" height="200" rx="20" fill="#FFFFFF" stroke="#F5A623" stroke-width="3"/>
  <text x="580" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#14201A">In-game spending</text>
  <circle cx="520" cy="160" r="26" fill="#FFE9D9" stroke="#F5A623" stroke-width="2"/>
  <text x="520" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#F5A623" font-weight="700">800</text>
  <text x="520" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5B6963">gems</text>
  <text x="600" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#5B6963">=</text>
  <circle cx="660" cy="160" r="26" fill="#F5A623" fill-opacity="0.15" stroke="#F5A623" stroke-width="2"/>
  <text x="660" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#14201A" font-weight="700">$9.99</text>
  <text x="580" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5B6963">designed not to feel like spending</text>
</svg>
