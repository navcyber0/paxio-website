<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F6F3EC"/>

  <!-- phone -->
  <rect x="300" y="60" width="200" height="340" rx="28" fill="#FFFFFF" stroke="#14201A" stroke-width="3"/>
  <rect x="320" y="96" width="160" height="260" rx="8" fill="#F6F3EC"/>
  <circle cx="400" cy="374" r="10" fill="none" stroke="#14201A" stroke-width="2.5"/>

  <!-- app icon on screen -->
  <rect x="352" y="128" width="56" height="56" rx="14" fill="#12B886"/>
  <path d="M370 156 l10 10 l16 -20" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lines representing app content -->
  <rect x="340" y="204" width="120" height="10" rx="5" fill="#E7E2D4"/>
  <rect x="340" y="224" width="90" height="10" rx="5" fill="#E7E2D4"/>
  <rect x="340" y="244" width="104" height="10" rx="5" fill="#E7E2D4"/>

  <!-- location pin, crossed out, floating off to the side -->
  <g transform="translate(560,150)">
    <path d="M40 0 C62 0 80 18 80 40 C80 68 40 110 40 110 C40 110 0 68 0 40 C0 18 18 0 40 0 Z"
          fill="#FFFFFF" stroke="#E24C36" stroke-width="4"/>
    <circle cx="40" cy="40" r="16" fill="#F6F3EC" stroke="#E24C36" stroke-width="3"/>
    <line x1="-4" y1="118" x2="88" y2="-8" stroke="#E24C36" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- dashed path from phone to pin, broken -->
  <path d="M470 180 C520 170 540 160 555 150" stroke="#5B6963" stroke-width="2.5" stroke-dasharray="6 8" fill="none"/>

  <text x="60" y="380" font-family="system-ui, sans-serif" font-size="20" fill="#5B6963">No location data leaves the device — ever.</text>
</svg>
