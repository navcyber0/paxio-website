    </g>

    <rect x="34" y="222" width="112" height="34" rx="17" fill="#12B886"></rect>
    <text x="90" y="243" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Continue</text>
  </g>

  
  <g transform="translate(500,110)">
    <circle r="30" fill="#FFFFFF" stroke="#F5A623" stroke-width="4"></circle>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#F5A623" stroke-width="3.5" stroke-linecap="round"></line>
    <line x1="0" y1="0" x2="12" y2="6" stroke="#F5A623" stroke-width="3.5" stroke-linecap="round"></line>
  </g>
</svg>